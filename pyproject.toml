[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TheEyeOfSauron"
version = "2.2.0"
description = "Telegram Orchestra Poll Parser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Telethon==1.42.0",
    "google-auth==2.40.3",
    "requests==2.32.5",
    "tzdata==2025.3",
]

[project.scripts]
eye-of-sauron = "eye.__main__:run"
eye-sync-users = "eye.sync_users:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
